{% extends 'base.html' %}
{% block title %}Track task · Taskmate AI{% endblock %}

{% block content %}
<div class="tracker-container">
  <h2>Task Status: {{ status }}</h2>
  <div class="worker-details">
    <h3>Assigned Worker: {{ worker.name }}</h3>
    <p>Role: {{ worker.role }}</p>
    <p>Rate: ₹{{ worker.rate }}</p>
  </div>

  <div class="task-details">
    <h4>Task: {{ task.title }}</h4>
    <p>{{ task.description }}</p>
  </div>

  <!-- Payment Action -->
  <div class="payment-section">
    <button onclick="payNow({{ worker.rate * 100 }})" class="btn-primary">
      Pay ₹{{ worker.rate }} Now
    </button>
  </div>
</div>

<!-- Razorpay Integration Script -->
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
  const razorpayKey = "{{ razorpay_key }}";

  function payNow(amountInPaise) {
    fetch("/create-order", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ amount: amountInPaise })
    })
    .then(res => res.json())
    .then(order => {
      const options = {
        key: razorpayKey,
        amount: order.amount,
        currency: "INR",
        name: "TaskMate AI",
        description: "Service Payment",
        order_id: order.id,
        handler: function (response) {
          fetch("/verify-payment", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(response)
          })
          .then(res => res.json())
          .then(data => {
            alert(data.message);
            if (data.status === "success") {
              window.location.reload();
            }
          });
        }
      };
      const rzp = new Razorpay(options);
      rzp.open();
    })
    .catch(error => console.error("Error creating order:", error));
  }
</script>
{% endblock %}
