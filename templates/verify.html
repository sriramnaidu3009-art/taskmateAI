{% extends 'base.html' %}

{% block title %}Verify Code · Taskmate AI{% endblock %}

{% block content %}
<div class="hero" style="max-width: 500px; margin: 40px auto;">
    <div class="task-form">
        <h2>Enter Verification Code</h2>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div style="background: var(--mint); border: 1px solid #cce2d8; padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; color: var(--green); font-size: 14px;">
              {% for message in messages %}
                <div>{{ message }}</div>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <form method="POST" action="/verify">
            <label>6-Digit OTP
                <input type="text" name="otp" placeholder="Enter 6-digit code" required maxlength="6" style="letter-spacing: 2px; font-weight: 600;">
            </label>

            <button type="submit" class="button primary" style="width: 100%; margin-top: 10px;">Verify & Register <span>→</span></button>
        </form>
    </div>
</div>
{% endblock %}
